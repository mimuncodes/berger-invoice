<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berger Cash Memo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#006fc9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--blue:#006fc9;--dark:#063b78;--yellow:#ffc900;--red:#ed1c24;--light:#eef8ff;--border:#1780d0}
*{box-sizing:border-box}
body{margin:0;background:#eef2f6;font-family:Arial,Helvetica,sans-serif;color:#082f62}
button,input{font:inherit}
.app{max-width:1250px;margin:auto;padding:16px}
.toolbar{background:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 3px 14px #0001;margin-bottom:14px}
.toolbar button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:white}
.toolbar button.secondary{background:#e8f3fc;color:var(--dark)}
.toolbar button.danger{background:#d92929}
.toolbar .status{margin-left:auto;font-size:13px;color:#4d6480}
.sheet{background:#fff;min-height:1120px;padding:26px 28px 20px;box-shadow:0 3px 18px #0002;border-radius:4px;position:relative;overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:flex-start;min-height:175px}
.logo{width:390px;height:190px;object-fit:contain;object-position:left top}
.tagline{width:400px;height:165px;object-fit:contain;object-position:right top}
.title{display:flex;justify-content:center;margin:-5px 0 10px}
.title span{font-size:34px;font-weight:900;color:white;padding:6px 76px;border-radius:40px;background:linear-gradient(100deg,#ffc400 0 7%,#075ac1 12% 80%,#f01931 92%);border:2px solid #fff;box-shadow:0 1px 0 #0b5fa9}
.info{border:2px solid var(--border);border-radius:14px;padding:14px 16px;background:linear-gradient(110deg,#f4fbff,#eef7ff);display:grid;grid-template-columns:1fr 1fr;gap:9px 28px;margin-bottom:13px}
.field{display:grid;grid-template-columns:145px 18px 1fr;align-items:center;font-weight:700}
.field input{width:100%;border:1px solid #9cc9e8;border-radius:6px;padding:8px 10px;color:#173f72;background:#fff}
.items{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--border);border-radius:12px;overflow:hidden}
.items th{background:linear-gradient(#0878d3,#0067b9);color:white;padding:9px 6px;font-size:17px;border-right:1px solid #fff}
.items th:last-child{border-right:0}
.items td{border-right:1px solid #2586cb;border-top:1px solid #b8d9ee;padding:0}
.items tr:nth-child(even) td{background:#edf8ff}
.items input{width:100%;border:0;background:transparent;padding:10px 8px;color:#0b3568;outline:none}
.items input:focus{background:#fff6c9}
.sl{width:58px;text-align:center;font-weight:700}
.desc{width:46%}.qty{width:12%}.rate{width:17%}.amount{width:18%}
.num{text-align:right}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:14px}
.thanks{font-size:40px;font-family:"Brush Script MT",cursive;color:#0759a6;line-height:.95;padding:0 10px 10px}
.thanks small{display:block;font-family:Arial;font-size:17px;text-align:center;color:#0759a6;font-style:italic;margin-top:4px}
.summary{width:485px;border:2px solid #086fc5;border-radius:12px;overflow:hidden}
.sumrow{display:grid;grid-template-columns:1fr 25px 175px;padding:8px 12px;align-items:center;font-weight:700}
.sumrow:nth-child(1){background:#eaf7ff}.sumrow:nth-child(2){background:#fff2bd}.sumrow:nth-child(3){background:#ffeaf2}
.sumrow input{border:1px solid #b8d5e8;border-radius:6px;padding:7px;text-align:right}
.sumrow.total{background:#006bbd;color:#fff;font-size:20px}.sumrow.total input{font-weight:800;color:#0a3766}
.footer{margin-top:28px;border-top:7px solid var(--blue);padding-top:9px;display:flex;justify-content:space-between;align-items:flex-end}
.features{display:flex;gap:28px;font-weight:700;font-size:13px}.feature{display:flex;gap:7px;align-items:center}.icon{width:34px;height:34px;border-radius:50%;background:#087bcf;color:white;display:grid;place-items:center;font-size:17px}.feature:nth-child(2) .icon{background:#38a62c}.feature:nth-child(3) .icon{background:#7a2dbd}
.sign{width:300px;text-align:center;border-top:2px dotted #555;padding-top:5px}.contact{display:block;font-size:14px;font-weight:700;color:#063b78;margin-top:7px;white-space:nowrap}
.history{background:#fff;border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 3px 14px #0001}
.history h3{margin:0 0 10px}.search{width:100%;max-width:450px;padding:9px;border:1px solid #abc9df;border-radius:8px;margin-bottom:10px}
.histrow{display:grid;grid-template-columns:90px 110px 1fr 130px 120px;gap:8px;padding:9px;border-bottom:1px solid #e4edf4;align-items:center;font-size:14px}
.histrow button{padding:6px 9px;border:0;border-radius:6px;cursor:pointer}.load{background:#e6f3ff;color:#0759a6}.del{background:#ffe9e9;color:#b30000}
@media(max-width:800px){.info{grid-template-columns:1fr;gap:7px;padding:12px 14px}.info .field{grid-column:1!important;grid-row:auto!important;min-width:0}.field{grid-template-columns:125px 14px minmax(0,1fr);min-width:0}.field input{min-width:0;max-width:100%}.header{min-height:130px}.logo{width:52%;height:130px}.tagline{width:45%;height:110px}.title span{font-size:24px;padding:6px 35px}.bottom{flex-direction:column}.summary{width:100%}.histrow{grid-template-columns:1fr 1fr}.sheet{padding:14px}.items{font-size:12px}.items th{font-size:13px}.contact{font-size:12px}}
@media print{
body{background:white}.app{padding:0;max-width:none}.toolbar,.history{display:none!important}.sheet{box-shadow:none;border-radius:0;padding:12mm 10mm;min-height:0}.header{min-height:42mm}.logo{width:90mm;height:42mm}.tagline{width:90mm;height:36mm}.title{margin-top:-2mm}.title span{font-size:24px}.info{break-inside:avoid}.items{break-inside:avoid}.footer{break-inside:avoid;margin-top:12mm}
input{color:#000!important}.sheet{page-break-after:avoid}
}
</style>
</head>

    <div class="title"><span>CASH MEMO</span></div>

    <div class="info">
      <label class="field">Memo No.<b>:</b><input id="memoNo"></label>
      <label class="field">Zone<b>:</b><input id="zone" value="Lakshmipur"></label>
      <label class="field">Date<b>:</b><input id="date" type="date"></label>
      <label class="field"></label>
      <label class="field">Customer Name<b>:</b><input id="customer" style="grid-column:3"></label>
      <label class="field">Mobile No.<b>:</b><input id="mobile"></label>
    </div>

    <table class="items">
      <thead><tr><th class="sl">SL.</th><th class="desc">Product Description</th><th class="qty">Qty.</th><th class="rate">Unit Price<br>(Tk.)</th><th class="amount">Amount<br>(Tk.)</th></tr></thead>
      <tbody id="itemsBody"></tbody>
    </table>

    <div class="bottom">
      <div class="thanks">Thank You<small>for your trust</small></div>
      <div class="summary">
        <div class="sumrow"><span>Sub Total</span><b>:</b><input id="subtotal" readonly></div>
        <div class="sumrow"><span>Discount (%)</span><b>:</b><input id="discount" type="number" min="0" step="0.01" value="0"></div>
        <div class="sumrow"><span>Discount Amount</span><b>:</b><input id="discountAmt" readonly></div>
        <div class="sumrow total"><span>Net Total</span><b>:</b><input id="netTotal" readonly></div>
      </div>
    </div>

    <div class="footer">
      <div class="features">
        <div class="feature"><span class="icon">✓</span>Quality<br>Products</div>
        <div class="feature"><span class="icon">✓</span>Long Lasting<br>Beauty</div>
        <div class="feature"><span class="icon">⌂</span>Trusted<br>Brand</div>
      </div>
      <div class="sign">Authorised Signature<br><span class="contact">Contact No.: +880 1711-227883</span></div>
    </div>
  </div>

  <div class="history">
    <h3>📋 Invoice / Memo History</h3>
    <input class="search" id="search" placeholder="Search memo no., customer, mobile or zone..." oninput="renderHistory()">
    <div id="history"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const KEY='berger_cash_memos_v1';
let memos=JSON.parse(localStorage.getItem(KEY)||'[]');

function pad(n){return String(n).padStart(4,'0')}
function nextNo(){
  let max=0;
  memos.forEach(m=>{let n=parseInt(String(m.memoNo).replace(/\D/g,''),10);if(!isNaN(n))max=Math.max(max,n)});
  return pad(max+1);
}
function today(){return new Date().toISOString().slice(0,10)}
function buildRows(){
  const body=document.getElementById('itemsBody'); body.innerHTML='';
  for(let i=1;i<=10;i++){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="sl">${i}</td>
      <td><input class="descIn" data-i="${i}" placeholder="Product / Service"></td>
      <td><input class="qtyIn num" data-i="${i}" type="number" min="0" step="0.01" value=""></td>
      <td><input class="rateIn num" data-i="${i}" type="number" min="0" step="0.01" value=""></td>
      <td><input class="amtIn num" data-i="${i}" readonly></td>`;
    body.appendChild(tr);
  }
  document.querySelectorAll('.qtyIn,.rateIn').forEach(x=>x.addEventListener('input',calc));
}
function calc(){
  let sub=0;
  document.querySelectorAll('#itemsBody tr').forEach(tr=>{
    let q=parseFloat(tr.querySelector('.qtyIn').value)||0;
    let r=parseFloat(tr.querySelector('.rateIn').value)||0;
    let a=q*r; tr.querySelector('.amtIn').value=a? a.toFixed(2):'';
    sub+=a;
  });
  let d=parseFloat(document.getElementById('discount').value)||0;
  let da=sub*d/100;
  document.getElementById('subtotal').value=sub.toFixed(2);
  document.getElementById('discountAmt').value=da.toFixed(2);
  document.getElementById('netTotal').value=(sub-da).toFixed(2);
}
document.getElementById('discount').addEventListener('input',calc);

function readForm(){
  const rows=[...document.querySelectorAll('#itemsBody tr')].map(tr=>({
    desc:tr.querySelector('.descIn').value,qty:tr.querySelector('.qtyIn').value,rate:tr.querySelector('.rateIn').value
  }));
  return {memoNo:document.getElementById('memoNo').value.trim(),date:document.getElementById('date').value,
    zone:document.getElementById('zone').value,customer:document.getElementById('customer').value,mobile:document.getElementById('mobile').value,
    discount:document.getElementById('discount').value,rows,subtotal:document.getElementById('subtotal').value,discountAmt:document.getElementById('discountAmt').value,netTotal:document.getElementById('netTotal').value};
}
function writeForm(m){
  document.getElementById('memoNo').value=m.memoNo||nextNo(); document.getElementById('date').value=m.date||today();
  document.getElementById('zone').value=m.zone||'Lakshmipur';document.getElementById('customer').value=m.customer||'';document.getElementById('mobile').value=m.mobile||'';
  document.getElementById('discount').value=m.discount||0;
  [...document.querySelectorAll('#itemsBody tr')].forEach((tr,i)=>{
    let r=(m.rows||[])[i]||{};tr.querySelector('.descIn').value=r.desc||'';tr.querySelector('.qtyIn').value=r.qty||'';tr.querySelector('.rateIn').value=r.rate||'';
  });calc();
}
function newMemo(){writeForm({memoNo:nextNo(),date:today(),zone:document.getElementById('zone').value||'Lakshmipur',discount:0,rows:[]});setStatus('New memo ready')}
function saveMemo(){
  const m=readForm(); if(!m.memoNo){alert('Memo number is required');return}
  const idx=memos.findIndex(x=>x.memoNo===m.memoNo);
  if(idx>=0)memos[idx]=m;else memos.push(m);
  localStorage.setItem(KEY,JSON.stringify(memos));renderHistory();setStatus('Saved • '+m.memoNo);
}
function loadMemo(no){let m=memos.find(x=>x.memoNo===no);if(m){writeForm(m);setStatus('Loaded • '+no);window.scrollTo({top:0,behavior:'smooth'})}}
function deleteMemo(no){if(confirm('Delete memo '+no+'?')){memos=memos.filter(x=>x.memoNo!==no);localStorage.setItem(KEY,JSON.stringify(memos));renderHistory();setStatus('Deleted • '+no)}}
function renderHistory(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=memos.filter(m=>JSON.stringify(m).toLowerCase().includes(q)).sort((a,b)=>String(b.memoNo).localeCompare(String(a.memoNo),undefined,{numeric:true}));
  document.getElementById('history').innerHTML=list.length?list.map(m=>`<div class="histrow"><b>${m.memoNo}</b><span>${m.date||''}</span><span>${m.customer||'Walk-in Customer'}</span><b>Tk. ${m.netTotal||'0.00'}</b><span><button class="load" onclick="loadMemo('${m.memoNo}')">Open</button> <button class="del" onclick="deleteMemo('${m.memoNo}')">Delete</button></span></div>`).join(''):'<div style="padding:12px;color:#71859c">No saved memos yet.</div>';
}
function clearForm(){if(confirm('Clear the current form?'))newMemo()}
function printMemo(){window.print()}
function getDriveUrl(){return localStorage.getItem('berger_drive_webapp_url')||''}
function driveSettings(){
  const current=getDriveUrl();
  const url=prompt('Paste your Google Apps Script Web App URL for Berger Cash Memo:',current);
  if(url===null)return;
  const v=url.trim();
  if(v){localStorage.setItem('berger_drive_webapp_url',v);setStatus('Google Drive connected');alert('Google Drive Web App URL saved. Now use ☁ Save to Google Drive.');}
  else{localStorage.removeItem('berger_drive_webapp_url');setStatus('Google Drive disconnected');}
}
function blobToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
async function makeInvoicePng(){
  const source=document.getElementById('memo');
  const memoNo=document.getElementById('memoNo').value||'Invoice';
  if(typeof html2canvas==='undefined')throw new Error('Picture engine is still loading.');
  const wrap=document.createElement('div');
  wrap.className='berger-capture-wrap';
  wrap.style.cssText='position:fixed;left:-20000px;top:0;width:1024px;height:1536px;background:#fff;z-index:-1;overflow:hidden;';
  const clone=source.cloneNode(true);
  clone.style.cssText='width:1024px!important;height:1536px!important;min-height:1536px!important;max-width:none!important;margin:0!important;padding:18px 26px 10px!important;box-sizing:border-box!important;background:#fff!important;box-shadow:none!important;border-radius:0!important;overflow:hidden!important;';
  wrap.appendChild(clone);document.body.appendChild(wrap);
  const force=document.createElement('style');
  force.textContent=`
    #memo{width:1024px!important;height:1536px!important;min-height:1536px!important;}
    #memo .header{height:176px!important;min-height:176px!important;display:flex!important;justify-content:space-between!important;align-items:flex-start!important;}
    #memo .logo{width:51%!important;height:168px!important;object-fit:contain!important;object-position:left top!important;}
    #memo .tagline{width:42%!important;height:145px!important;object-fit:contain!important;object-position:right top!important;}
    #memo .title{margin:-2px 0 10px!important;height:58px!important;}
    #memo .title span{font-size:34px!important;padding:7px 78px!important;line-height:42px!important;}
    #memo .info{height:178px!important;min-height:178px!important;grid-template-columns:1fr 1fr!important;grid-template-rows:34px 34px 34px 34px!important;gap:5px 28px!important;padding:12px 14px!important;margin-bottom:12px!important;}
    #memo .info .field:nth-child(1){grid-column:1;grid-row:1}.info .field:nth-child(2){grid-column:2;grid-row:1}.info .field:nth-child(3){grid-column:1;grid-row:2}.info .field:nth-child(4){display:none!important}.info .field:nth-child(5){grid-column:1 / span 2;grid-row:3}.info .field:nth-child(6){grid-column:1;grid-row:4;min-width:0}
    #memo .field{grid-template-columns:185px 18px minmax(0,1fr)!important;font-size:17px!important;height:34px!important;min-width:0}
    #memo .info input{min-width:0!important;max-width:100%!important;box-sizing:border-box!important}.info .field:nth-child(5) input{max-width:490px!important}

  `;
  clone.prepend(force);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const canvas=await html2canvas(clone,{width:1024,height:1536,windowWidth:1024,windowHeight:1536,scale:1,useCORS:true,allowTaint:true,backgroundColor:'#fff',logging:false,imageTimeout:15000,scrollX:0,scrollY:0});
  wrap.remove();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw new Error('PNG creation failed');
  return {blob,memoNo};
}
async function saveInvoicePicture(){
  const memoNo=document.getElementById('memoNo').value||'Invoice';
  const fileName='Berger-Cash-Memo-'+memoNo+'.png';
  try{setStatus('Creating invoice picture...');const {blob}=await makeInvoicePng();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fileName;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);setStatus('Invoice picture saved • '+memoNo)}
  catch(err){document.querySelectorAll('.berger-capture-wrap').forEach(x=>x.remove());console.error(err);setStatus('Picture save failed');alert('Could not create invoice picture. Please try again.')}
}
async function saveInvoiceToDrive(){
  const endpoint=getDriveUrl();
  if(!endpoint){driveSettings();return;}
  const memo=readForm();
  try{
    setStatus('Creating picture for Google Drive...');
    const {blob,memoNo}=await makeInvoicePng();
    const base64=await blobToBase64(blob);
    setStatus('Uploading to Google Drive...');
    await fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveInvoice',fileName:'Berger-Cash-Memo-'+memoNo+'.png',mimeType:'image/png',base64,folderName:'Berger Cash Memo',memo})});
    setStatus('Saved to Google Drive • '+memoNo);
    alert('Invoice sent to Google Drive successfully.');
  }catch(err){console.error(err);setStatus('Google Drive save failed');alert('Google Drive save failed. Check Drive Settings and make sure your Apps Script Web App is deployed for access.');}
}
function setStatus(s){document.getElementById('status').textContent=s}
function exportData(){
  const blob=new Blob([JSON.stringify(memos,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='berger-memo-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);setStatus('Backup exported')}
function importData(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;memos=data;localStorage.setItem(KEY,JSON.stringify(memos));renderHistory();newMemo();setStatus('Backup restored')}catch(err){alert('Invalid backup file')}};r.readAsText(f)
}
buildRows();newMemo();renderHistory();
